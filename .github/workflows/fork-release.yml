name: Patched Frontend Release

on:
  push:
    branches:
      - patched

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG_SUFFIX: patched

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run start:build

      - name: Create ZIP archive of /dist
        run: zip -r remnawave-frontend.zip ./dist

      # Recreated on every push so the tag always points to the built commit
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(jq -r .version package.json)-$TAG_SUFFIX"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" remnawave-frontend.zip \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Built from $GITHUB_SHA" \
            --latest=false
